# Same file on the Mac used for development and on the café Windows server.
# Paths are relative. Do not add machine-specific absolute paths.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gdos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gdos}
      TZ: UTC
    volumes:
      - gd_os_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gdos} -d ${POSTGRES_DB:-gdos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://gdos:change-me@postgres:5432/gdos}
      CAFE_TIMEZONE: ${CAFE_TIMEZONE:-Asia/Kolkata}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      GD_OS_ADMIN_USERNAME: ${GD_OS_ADMIN_USERNAME:-admin}
      GD_OS_ADMIN_PASSWORD: ${GD_OS_ADMIN_PASSWORD:-change-me}
      TZ: UTC
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gd_os_pgdata:
